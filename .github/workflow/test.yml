name: Test
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
jobs:
  run-action:
    - name: Run action
      runs-on: ubuntu-latest
      with:
        node-version: 20.x
        cache: npm
        cache-dependency-path: package-lock.json
    - name: Install deps
      run: npm ci
